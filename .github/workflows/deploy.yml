name: CI/CD - Build, Test, and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'

jobs:
  # Job 1: Validate and Test
  validate:
    name: Validate Code and Schema
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check TypeScript compilation
        run: npm run type-check
        
      - name: Run linting
        run: npm run lint
        
      - name: Validate SQL schema files exist
        run: |
          if [ ! -f "sql/schema-v1.sql" ]; then
            echo "❌ ERROR: sql/schema-v1.sql not found!"
            exit 1
          fi
          if [ ! -f "sql/migrations/001-add-sync-status-columns.sql" ]; then
            echo "❌ ERROR: sql/migrations/001-add-sync-status-columns.sql not found!"
            exit 1
          fi
          echo "✅ SQL schema files validated"
          
      - name: Check for required environment variables
        run: |
          echo "Checking environment variable placeholders..."
          if grep -r "YOUR_SUPABASE_URL\|YOUR_SUPABASE_KEY" .env.local 2>/dev/null; then
            echo "⚠️  WARNING: Placeholder values found in .env.local"
            echo "Make sure to set actual values in Vercel environment variables"
          fi
          
  # Job 2: Build Next.js app
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        env:
          # Use placeholder values during build (actual values in Vercel)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
        run: npm run build
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 1

  # Job 3: Deploy to Vercel (only on main branch)
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
          
      - name: Deploy to Vercel
        uses: vercel/action@v6
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          
  # Job 4: Post-deployment notification
  notify:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "App should be live at your Vercel domain"
          else
            echo "⚠️  Deployment skipped (only runs on main branch pushes)"
          fi
